version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: buryat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buryat_tailoring
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/02_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql

volumes:
  pg_data:
